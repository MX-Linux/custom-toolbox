name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build-test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5

      - name: Install common build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qml6-module-qt-labs-settings \
            qml6-module-qtcore \
            qml6-module-qtqml \
            qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window

      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        run: sudo apt-get install -y gcc-14 g++-14

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get install -y clang

      - name: Configure (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Configure (Clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CLANG=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Lint QML
        run: cmake --build build --target all_qmllint

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  debian-package-check:
    name: Debian ${{ matrix.release }} package
    runs-on: ubuntu-latest
    container: debian:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging dependencies from debian/control
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control

      - name: Build binary package (unsigned, including tests)
        run: dpkg-buildpackage -us -uc -b

      - name: Install package and its runtime dependencies
        run: apt-get install -y --no-install-recommends ../custom-toolbox_*.deb

      - name: Lint QML
        run: cmake --build obj-$(dpkg-architecture -qDEB_HOST_GNU_TYPE) --target all_qmllint

      - name: Smoke test installed application
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          status=0
          timeout 10s custom-toolbox example.list >startup.log 2>&1 || status=$?
          cat startup.log
          test "$status" -eq 124
          ! grep -E 'failed to load component|is not installed|is not a type|ReferenceError|TypeError' startup.log
